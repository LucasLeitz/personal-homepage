<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Leitz</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
    <img class="profile" src="assets/lucas_photo.jpg" alt="Lucas Leitz">
    <h1>Lucas Leitz</h1>
    <p class="subtitle">Software Engineer • Full-Stack Developer</p>

    <div class="links">
        <a href="https://github.com/LucasLeitz" target="_blank">GitHub</a>
        <a href="https://www.linkedin.com/in/lucas-leitz" target="_blank">LinkedIn</a>
        <a href="mailto:lucasleitz@outlook.com">Email</a>
    </div>

    <h2>Projects</h2>
    <ul class="projects">
        <li>
            <a href="https://github.com/LucasLeitz/media-library-v2" target="_blank">
                Completed Media Library
            </a>
            <span class="divider"> | </span>
            <a href="https://media.lucasleitz.com" target="_blank">
                Live Site
            </a>
            <span id="media-status">⏳ Checking...</span>
        </li>
        <li><a href="https://github.com/LucasLeitz/study-partner" target="_blank">Study Partner (WIP)</a></li>
        <li><a href="https://github.com/LucasLeitz/dungeon-crawler-lucas" target="_blank">Dungeon Crawler Game (WIP)</a></li>
        <li><a href="https://github.com/LucasLeitz/lottery-simulator" target="_blank">Lottery Simulator (WIP)</a></li>
    </ul>

</div>

<script>
    async function checkMediaLibrary() {
        const statusEl = document.getElementById("media-status");

        try {
            // If the server is up and reachable, this resolves.
            // If it's down, it will throw and go to the catch.
            await fetch("https://media.lucasleitz.com/api/health", {
                method: "GET",
                mode: "no-cors"
            });

            statusEl.textContent = "✔️ Online";
            statusEl.style.color = "green";
        } catch (err) {
            console.error("Media library health check failed:", err);
            statusEl.textContent = "❌ Offline";
            statusEl.style.color = "red";
        }
    }

    checkMediaLibrary();
</script>

</body>
</html>
